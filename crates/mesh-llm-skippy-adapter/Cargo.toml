[package]
name = "mesh-llm-skippy-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mesh configuration and preparation adapter for Skippy"
repository = "https://github.com/Mesh-LLM/mesh-llm"
readme = "README.md"

[features]
default = []
# Host tests must not write advisory hashes to the developer's real cache.
test-support = []
dynamic-native-runtime = ["skippy-api/dynamic-native-runtime", "skippy-runtime/dynamic-native-runtime", "skippy-serving/dynamic-native-runtime"]

[lints]
workspace = true

[dependencies]
mesh-llm-config = { path = "../mesh-llm-config", version = "0.76.1" }
mesh-llm-events = { path = "../mesh-llm-events", version = "0.76.1" }
skippy-config = { path = "../skippy-config", version = "0.76.1" }
skippy-api = { path = "../skippy-api", version = "0.76.1" }
skippy-model-artifact = { path = "../skippy-model-artifact", version = "0.76.1" }
skippy-model-hf = { path = "../skippy-model-hf", version = "0.76.1" }
skippy-openai-frontend = { path = "../skippy-openai-frontend", version = "0.76.1" }
skippy-protocol = { path = "../skippy-protocol", version = "0.76.1" }
skippy-runtime = { path = "../skippy-runtime", version = "0.76.1" }
skippy-serving = { path = "../skippy-serving", version = "0.76.1" }
anyhow = "1"
dirs = "6.0.0"
serde_json = "1"
toml = "1.1"
tracing = "0.1"

[dev-dependencies]
skippy-model = { path = "../skippy-model", version = "0.76.1" }
tempfile = "3"
