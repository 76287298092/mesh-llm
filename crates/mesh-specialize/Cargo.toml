[package]
name = "mesh-specialize"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Internal Rust-only specialized GPU runtime experiments"
publish = false

[features]
validation = []

[[bin]]
name = "mesh-specialize-validate"
path = "validation/main.rs"
required-features = ["validation"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex = "0.4"
mesh-llm-native-runtime = { path = "../mesh-llm-native-runtime", version = "0.76.1" }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.9"
tracing = "0.1"

[lints]
workspace = true
