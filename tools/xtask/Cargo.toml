[package]
name = "xtask"
version.workspace = true
edition = "2024"
publish = false

[dependencies]
ed25519-dalek = { version = "=3.0.0", features = ["rand_core"] }
getrandom = "0.3"
hex = "0.4"
mesh-llm-release-footer.workspace = true
mesh-specialize = { path = "../../crates/mesh-specialize" }
mesh-llm-native-runtime = { path = "../../crates/mesh-llm-native-runtime" }
mesh-llm-hardware-profile = { path = "../../crates/mesh-llm-hardware-profile" }
proc-macro2 = { version = "1", features = ["span-locations"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
syn = { version = "2", features = ["full", "visit"] }
