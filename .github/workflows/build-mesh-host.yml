name: build mesh-llm host (windows x86_64)

# Produces `mesh-llm.exe` — the Rust host only.
#
# The native runtime (`native-runtimes/**/lib/llama.dll` and friends) is a
# separate, heavily patched llama.cpp fork and is NOT rebuilt here. This
# workflow exists so the host can be compiled somewhere other than the machine
# it is deployed to.
#
# Why the release profile is overridden
# -------------------------------------
# The repository's release profile uses `lto = "thin"` with
# `codegen-units = 1`, which puts a whole crate in one LLVM module. On a 16 GB
# builder rustc exhausts memory and dies with STATUS_STACK_BUFFER_OVERRUN
# (0xC0000409) or stalls with the pagefile pinned. Sixteen codegen units with
# LTO off, plus a bounded job count, compiles the same tree on 16 GB. These are
# the exact values that build successfully on the development workstation.

on:
  workflow_dispatch:
  push:
    branches:
      - deepseek41-v41-port

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_LTO: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          # The host's build script reads repository metadata, so keep history.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      # The web console is embedded at compile time --
      # `mesh-llm-ui/src/lib.rs` is `include_dir!("$MESH_LLM_UI_DIST")` -- and
      # that crate's build script falls back to an EMPTY directory when
      # `crates/mesh-llm-ui/dist` is absent, silently. The host then builds
      # cleanly and serves 500 on every console route, so the dist has to exist
      # before cargo runs.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: crates/mesh-llm-ui/pnpm-lock.yaml

      - name: Build the web console
        working-directory: crates/mesh-llm-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          if (-not (Test-Path dist/index.html)) {
            throw "the console build produced no dist/index.html"
          }
          "console dist: $((Get-ChildItem dist -Recurse -File | Measure-Object).Count) files"

      # The Rust cache can hold a `mesh-llm-ui` artifact built when dist was
      # absent. Drop it so the host embeds the console that was just built
      # rather than the empty fallback.
      - name: Force the console crate to rebuild against the real dist
        run: cargo clean -p mesh-llm-ui

      - name: Build the host
        run: cargo build --release -p mesh-llm -j 2

      - name: Report the binary
        shell: pwsh
        run: |
          $exe = 'target/release/mesh-llm.exe'
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $item = Get-Item $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "path   : $($item.FullName)"
          "bytes  : $($item.Length)"
          "built  : $($item.LastWriteTime)"
          "sha256 : $hash"
          "sha8   : $($hash.Substring(0,8))"
          "sha256=$hash" >> $env:GITHUB_OUTPUT
        id: binary

      - name: Job summary
        shell: pwsh
        run: |
          @(
            '### mesh-llm.exe'
            ''
            "- sha256: ``${{ steps.binary.outputs.sha256 }}``"
          ) >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: mesh-llm-exe-windows-x86_64
          path: target/release/mesh-llm.exe
          if-no-files-found: error
          retention-days: 30
